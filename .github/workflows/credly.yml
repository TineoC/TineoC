name: Update Credly badges

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render badges
        run: |
          curl -fsS -H 'Accept: application/json' \
            'https://www.credly.com/users/christopher-tineo/badges.json' \
            | bash .github/credly.sh README.md
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore: update Credly badges'
          git push
      # GitHub disables schedules after 60 days without repo activity.
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable credly.yml
